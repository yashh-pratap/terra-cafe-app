<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terra Coffee & Co. - Faridabad</title>
    
    <!-- Load React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Load Babel to compile React JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configure Tailwind fonts -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['ui-sans-serif', 'system-ui', 'sans-serif'],
                        serif: ['ui-serif', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbar for category menu */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body class="bg-stone-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- INLINE ICONS (Since we can't install npm packages on direct GitHub) ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Coffee = (p) => <IconWrapper {...p}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></IconWrapper>;
        const MapPin = (p) => <IconWrapper {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconWrapper>;
        const Clock = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconWrapper>;
        const ShoppingCart = (p) => <IconWrapper {...p}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></IconWrapper>;
        const User = (p) => <IconWrapper {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconWrapper>;
        const ChevronRight = (p) => <IconWrapper {...p}><path d="m9 18 6-6-6-6"/></IconWrapper>;
        const BatteryCharging = (p) => <IconWrapper {...p}><path d="M15 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><path d="M6 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1"/><path d="m11 7-3 5h4l-3 5"/><line x1="22" x2="22" y1="11" y2="13"/></IconWrapper>;
        const Search = (p) => <IconWrapper {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconWrapper>;
        const Plus = (p) => <IconWrapper {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconWrapper>;
        const Minus = (p) => <IconWrapper {...p}><path d="M5 12h14"/></IconWrapper>;
        const X = (p) => <IconWrapper {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconWrapper>;

        // --- MOCK DATA ---
        const CAFE_TABLES = [
            { id: 'T1', type: 'window', capacity: 2, isOccupied: false, hasPower: true },
            { id: 'T2', type: 'window', capacity: 2, isOccupied: true, hasPower: true },
            { id: 'T3', type: 'center', capacity: 4, isOccupied: false, hasPower: false },
            { id: 'T4', type: 'center', capacity: 4, isOccupied: true, hasPower: false },
            { id: 'T5', type: 'corner', capacity: 2, isOccupied: false, hasPower: true },
            { id: 'T6', type: 'communal', capacity: 8, isOccupied: false, hasPower: true },
            { id: 'T7', type: 'outdoor', capacity: 2, isOccupied: false, hasPower: false },
            { id: 'T8', type: 'outdoor', capacity: 4, isOccupied: true, hasPower: false },
        ];

        const MENU_ITEMS = [
            { id: 'c1', category: 'Coffee', name: 'Terra House Blend Espresso', price: 180, description: 'Our signature dark roast with notes of cocoa.', image: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&q=80&w=200&h=200' },
            { id: 'c2', category: 'Coffee', name: 'Himalayan Flat White', price: 220, description: 'Smooth microfoam over double ristretto.', image: 'https://images.unsplash.com/photo-1577968897966-3d4325b36b61?auto=format&fit=crop&q=80&w=200&h=200' },
            { id: 'c3', category: 'Coffee', name: 'Cold Brew Oat Latte', price: 250, description: '12-hour steeped cold brew with oat milk.', image: 'https://images.unsplash.com/photo-1461023058943-0708f5299c4f?auto=format&fit=crop&q=80&w=200&h=200' },
            { id: 'f1', category: 'Food', name: 'Avocado Sourdough Toast', price: 350, description: 'Smashed avocado, cherry tomatoes, microgreens.', image: 'https://images.unsplash.com/photo-1541519227354-08fa5d50c44d?auto=format&fit=crop&q=80&w=200&h=200' },
            { id: 'f2', category: 'Food', name: 'Bir Apple Cinnamon Muffin', price: 160, description: 'Freshly baked daily with local apples.', image: 'https://images.unsplash.com/photo-1608039829572-78524f79c4c7?auto=format&fit=crop&q=80&w=200&h=200' },
        ];

        const CATEGORIES = ['All', 'Coffee', 'Tea', 'Food', 'Merch'];

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [cart, setCart] = useState([]);
            const [tables, setTables] = useState(CAFE_TABLES);
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [showOrderModal, setShowOrderModal] = useState(false);
            const [orderType, setOrderType] = useState('dine-in');
            const [selectedTable, setSelectedTable] = useState('');

            useEffect(() => {
                const interval = setInterval(() => {
                    setTables(currentTables => 
                        currentTables.map(table => {
                            if (Math.random() > 0.9) return { ...table, isOccupied: !table.isOccupied };
                            return table;
                        })
                    );
                }, 10000);
                return () => clearInterval(interval);
            }, []);

            const addToCart = (item) => {
                setCart(prev => {
                    const existing = prev.find(i => i.id === item.id);
                    if (existing) return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
                    return [...prev, { ...item, quantity: 1 }];
                });
            };

            const updateCartQuantity = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQuantity = item.quantity + delta;
                        return newQuantity > 0 ? { ...item, quantity: newQuantity } : item;
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const getCartTotal = () => cart.reduce((total, item) => total + (item.price * item.quantity), 0);
            const getCartCount = () => cart.reduce((count, item) => count + item.quantity, 0);

            const confirmOrder = () => {
                if (orderType === 'dine-in' && !selectedTable) {
                    alert("Please select a table for Dine-In");
                    return;
                }
                alert("Order Placed Successfully!");
                setCart([]);
                setShowOrderModal(false);
                setActiveTab('home');
            };

            const renderHomeView = () => (
                <div className="p-4 pb-24 space-y-6">
                    <div className="bg-amber-900 text-amber-50 rounded-2xl p-6 shadow-lg relative overflow-hidden">
                        <div className="absolute top-0 right-0 p-4 opacity-20"><Coffee size={100} /></div>
                        <h2 className="text-2xl font-serif mb-1 relative z-10">Welcome to Terra,</h2>
                        <p className="text-amber-200/80 mb-4 relative z-10">Faridabad's finest brew awaits.</p>
                        <button onClick={() => setActiveTab('order')} className="bg-amber-100 text-amber-900 px-4 py-2 rounded-full font-medium text-sm flex items-center shadow-md relative z-10">
                            Order Now <ChevronRight size={16} className="ml-1" />
                        </button>
                    </div>

                    <div className="bg-white rounded-2xl p-5 shadow-sm border border-stone-100">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-semibold text-lg flex items-center text-stone-800">
                                <MapPin className="mr-2 text-amber-600" size={20} /> Live Seating Status
                            </h3>
                            <span className="text-xs font-medium bg-green-100 text-green-700 px-2 py-1 rounded-full flex items-center">
                                <span className="w-2 h-2 rounded-full bg-green-500 mr-1 animate-pulse"></span> Live
                            </span>
                        </div>
                        <div className="flex gap-4 mb-4 text-xs text-stone-500">
                           <div className="flex items-center"><div className="w-3 h-3 rounded-full bg-emerald-400 mr-1"></div> Available</div>
                           <div className="flex items-center"><div className="w-3 h-3 rounded-full bg-rose-400 mr-1"></div> Occupied</div>
                           <div className="flex items-center"><BatteryCharging size={12} className="mr-1"/> Power</div>
                        </div>
                        <div className="grid grid-cols-4 gap-3 bg-stone-50 p-4 rounded-xl border border-stone-200">
                            {tables.map(table => (
                                <div key={table.id} className={`relative p-3 rounded-xl flex flex-col items-center justify-center transition-all duration-300 ${table.isOccupied ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'} border-2 shadow-sm ${table.type === 'communal' ? 'col-span-2 aspect-auto h-24' : 'aspect-square'}`}>
                                    <span className="font-bold">{table.id}</span>
                                    <span className="text-[10px] opacity-70 flex items-center mt-1"><User size={10} className="mr-0.5"/> {table.capacity}</span>
                                    {table.hasPower && <div className={`absolute top-1 right-1 ${table.isOccupied ? 'text-rose-400' : 'text-emerald-400'}`}><BatteryCharging size={12} /></div>}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderOrderView = () => {
                const filteredItems = MENU_ITEMS.filter(item => (selectedCategory === 'All' || item.category === selectedCategory) && item.name.toLowerCase().includes(searchQuery.toLowerCase()));
                return (
                    <div className="h-full flex flex-col">
                        <div className="p-4 bg-white sticky top-0 z-10 shadow-sm">
                            <h2 className="text-2xl font-serif text-stone-800 mb-4">Menu</h2>
                            <div className="relative mb-4">
                                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"><Search size={18} /></span>
                                <input type="text" placeholder="Search coffee, food..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-stone-100 pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50" />
                            </div>
                            <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                                {CATEGORIES.map(cat => (
                                    <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-4 py-1.5 rounded-full text-sm whitespace-nowrap ${selectedCategory === cat ? 'bg-amber-900 text-white' : 'bg-stone-100 text-stone-600'}`}>{cat}</button>
                                ))}
                            </div>
                        </div>
                        <div className="p-4 pb-24 space-y-4 overflow-y-auto">
                            {filteredItems.map(item => (
                                <div key={item.id} className="flex bg-white rounded-2xl p-3 shadow-sm border border-stone-100">
                                    <img src={item.image} alt={item.name} className="w-24 h-24 rounded-xl object-cover" />
                                    <div className="ml-4 flex-1 flex flex-col justify-between py-1">
                                        <div>
                                            <h4 className="font-medium text-stone-800">{item.name}</h4>
                                            <p className="text-xs text-stone-500 mt-1 line-clamp-2">{item.description}</p>
                                        </div>
                                        <div className="flex justify-between items-center mt-2">
                                            <span className="font-semibold text-amber-900">₹{item.price}</span>
                                            <button onClick={() => addToCart(item)} className="bg-amber-900 text-white p-1.5 rounded-lg"><Plus size={16} /></button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            const renderCartView = () => (
                <div className="p-4 pb-24 h-full flex flex-col">
                    <h2 className="text-2xl font-serif text-stone-800 mb-6">Your Order</h2>
                    {cart.length === 0 ? (
                        <div className="flex-1 flex flex-col items-center justify-center text-stone-400">
                            <ShoppingCart size={48} className="opacity-20 mb-4" />
                            <p>Your cart is empty</p>
                        </div>
                    ) : (
                        <>
                            <div className="flex-1 overflow-y-auto space-y-4">
                                {cart.map(item => (
                                    <div key={item.id} className="flex items-center justify-between bg-white p-3 rounded-2xl border border-stone-100">
                                        <div className="flex items-center flex-1">
                                           <img src={item.image} className="w-12 h-12 rounded-lg object-cover mr-3" />
                                           <div><p className="font-medium text-sm">{item.name}</p><p className="text-amber-900 font-semibold text-sm">₹{item.price}</p></div>
                                        </div>
                                        <div className="flex items-center bg-stone-100 rounded-lg p-1 ml-2">
                                            <button onClick={() => updateCartQuantity(item.id, -1)} className="p-1"><Minus size={14}/></button>
                                            <span className="w-6 text-center text-sm font-medium">{item.quantity}</span>
                                            <button onClick={() => updateCartQuantity(item.id, 1)} className="p-1"><Plus size={14}/></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="bg-white rounded-2xl p-5 shadow-lg border border-stone-100 mt-4">
                                <div className="flex justify-between font-bold text-lg mb-4"><span>Total</span><span>₹{getCartTotal() + Math.round(getCartTotal() * 0.05)}</span></div>
                                <button onClick={() => setShowOrderModal(true)} className="w-full bg-amber-900 text-white py-3.5 rounded-xl font-medium">Proceed to Checkout</button>
                            </div>
                        </>
                    )}

                    {showOrderModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-end justify-center">
                            <div className="bg-white w-full max-w-md rounded-t-3xl p-6">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-serif font-bold">Checkout</h3>
                                    <button onClick={() => setShowOrderModal(false)} className="p-2 bg-stone-100 rounded-full"><X size={18}/></button>
                                </div>
                                <div className="flex gap-3 mb-6">
                                    <button onClick={() => setOrderType('dine-in')} className={`flex-1 py-3 px-4 rounded-xl border-2 flex flex-col items-center ${orderType === 'dine-in' ? 'border-amber-900 bg-amber-50 text-amber-900' : 'border-stone-200 text-stone-500'}`}><Coffee size={24} className="mb-2" /><span className="font-medium text-sm">Dine-In</span></button>
                                    <button onClick={() => setOrderType('pickup')} className={`flex-1 py-3 px-4 rounded-xl border-2 flex flex-col items-center ${orderType === 'pickup' ? 'border-amber-900 bg-amber-50 text-amber-900' : 'border-stone-200 text-stone-500'}`}><ShoppingCart size={24} className="mb-2" /><span className="font-medium text-sm">Pickup</span></button>
                                </div>
                                {orderType === 'dine-in' && (
                                    <select value={selectedTable} onChange={(e) => setSelectedTable(e.target.value)} className="w-full border-2 border-stone-200 rounded-xl p-3 mb-6 bg-white">
                                        <option value="">Choose table number...</option>
                                        {tables.map(t => <option key={t.id} value={t.id} disabled={t.isOccupied}>{t.id} {t.isOccupied ? '(Occupied)' : '(Available)'}</option>)}
                                    </select>
                                )}
                                <button onClick={confirmOrder} className="w-full bg-amber-900 text-white py-4 rounded-xl font-medium">Pay & Place Order</button>
                            </div>
                        </div>
                    )}
                </div>
            );

            return (
                <div className="min-h-screen flex justify-center bg-stone-200">
                    <div className="w-full max-w-md bg-stone-50 min-h-screen relative shadow-2xl overflow-hidden flex flex-col">
                        <header className="bg-white px-4 py-3 flex justify-between items-center shadow-sm z-20">
                            <div><h1 className="font-serif text-xl font-bold text-amber-900">Terra Coffee & Co.</h1><p className="text-[10px] text-stone-500 font-medium uppercase tracking-wider">Faridabad</p></div>
                            <div className="bg-amber-100 p-2 rounded-full"><User size={18} className="text-amber-900" /></div>
                        </header>
                        
                        <main className="flex-1 overflow-y-auto relative">
                            {activeTab === 'home' && renderHomeView()}
                            {activeTab === 'order' && renderOrderView()}
                            {activeTab === 'cart' && renderCartView()}
                        </main>

                        <nav className="absolute bottom-0 w-full bg-white border-t border-stone-200 px-6 py-3 flex justify-between items-center z-30 pb-safe">
                            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center p-2 ${activeTab === 'home' ? 'text-amber-900' : 'text-stone-400'}`}><MapPin size={22} /><span className="text-[10px] font-medium mt-1">Explore</span></button>
                            <button onClick={() => setActiveTab('order')} className={`flex flex-col items-center p-2 ${activeTab === 'order' ? 'text-amber-900' : 'text-stone-400'}`}><Coffee size={22} /><span className="text-[10px] font-medium mt-1">Menu</span></button>
                            <button onClick={() => setActiveTab('cart')} className={`flex flex-col items-center p-2 relative ${activeTab === 'cart' ? 'text-amber-900' : 'text-stone-400'}`}>
                                <ShoppingCart size={22} />
                                {getCartCount() > 0 && <span className="absolute -top-1 -right-2 bg-rose-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full">{getCartCount()}</span>}
                                <span className="text-[10px] font-medium mt-1">Cart</span>
                            </button>
                        </nav>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
